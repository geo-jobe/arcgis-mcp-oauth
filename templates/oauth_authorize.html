<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorize MCP Access</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            line-height: 1.5;
            color: #17242b;
            background:
                radial-gradient(circle at 15% 10%, #dceef7 0, transparent 34rem),
                #f5f3ed;
        }

        main {
            width: min(100%, 620px);
            background: #fff;
            border: 1px solid #d9dedc;
            border-radius: 18px;
            box-shadow: 0 24px 70px rgb(23 36 43 / 12%);
            overflow: hidden;
        }

        header {
            padding: 2rem 2rem 1.5rem;
            border-bottom: 1px solid #e7e9e7;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            letter-spacing: -0.03em;
            margin: 0;
        }

        .client {
            padding: 1.5rem 2rem;
        }

        .client-name {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
        }

        .client-id, .resource {
            display: block;
            color: #59686f;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            overflow-wrap: anywhere;
        }

        .resource {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #eef0ee;
        }

        .scopes {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }

        .scope {
            background: #e6f2f8;
            border: 1px solid #bfdeed;
            border-radius: 999px;
            color: #005e95;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.2rem 0.65rem;
        }

        form { padding: 0 2rem 2rem; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #aeb8b9;
            border-radius: 8px;
            background: #fff;
        }

        button {
            background: #007ac2;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }

        button:hover {
            background: #005e95;
        }

        button:focus-visible, select:focus-visible {
            outline: 3px solid #f4c430;
            outline-offset: 2px;
        }

        .actions { display: flex; justify-content: flex-end; gap: 0.75rem; flex-wrap: wrap; }
        .deny { background: transparent; color: #59686f; }
        .deny:hover { background: #f0f2f1; }

        @media (max-width: 480px) {
            body { padding: 0; place-items: stretch; }
            main { min-height: 100vh; border: 0; border-radius: 0; }
            header, .client { padding-left: 1.25rem; padding-right: 1.25rem; }
            form { padding-left: 1.25rem; padding-right: 1.25rem; }
            .actions button { flex: 1; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Connect to ArcGIS?</h1>
    </header>

    <section class="client" aria-label="Authorization request details">
        {% if let Some(client_name) = client_name %}
        <p class="client-name">{{ client_name }}</p>
        {% endif %}
        <code class="client-id">{{ client_id }}</code>
        <code class="resource">{{ resource }}</code>
        <div class="scopes" aria-label="Requested permissions">
            {% for scope in scopes %}<span class="scope">{{ scope }}</span>{% endfor %}
        </div>
    </section>

    <form method="post" action="{{ continue_url }}">
        <input type="hidden" name="request_id" value="{{ request_id }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="portal_key">ArcGIS portal</label>
        <select id="portal_key" name="portal_key" required>
            {% for portal in portals %}
            <option value="{{ portal.key }}">{{ portal.label }}</option>
            {% endfor %}
        </select>

        <div class="actions">
            <button class="deny" type="submit" name="decision" value="deny" formnovalidate>Deny</button>
            <button class="allow" type="submit" name="decision" value="allow">Allow and continue</button>
        </div>
    </form>
</main>
</body>
</html>
