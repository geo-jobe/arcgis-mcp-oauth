services:
  arcgis-mcp-oauth:
    container_name: arcgis-mcp-oauth
    image: arcgis-mcp-oauth:latest
    env_file: .env
    environment:
      AUTH_ADDRESS: 0.0.0.0
    volumes:
      - auth-data:/app/data
    ports:
      - "${AUTH_PORT:-3324}:3324"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3324/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - arcgis-mcp

volumes:
  auth-data:

networks:
  arcgis-mcp:
    name: arcgis-mcp
