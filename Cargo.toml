[package]
name = "micro-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
sqlite = "0.37.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["cors"] }
